name: Build profiles

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile:
          - nfc
          - usb
          - full
    env:
      UV_PYTHON: "3.14"
      ZEROFIDO_PROFILE: ${{ matrix.profile }}
      ZEROFIDO_RELEASE_DIAGNOSTICS: "0"
      ZEROFIDO_USB_DIAGNOSTICS: "0"
      ZEROFIDO_AUTO_ACCEPT_REQUESTS: "0"
      ZEROFIDO_DEV_SCREENSHOT: "0"
      ZEROFIDO_DEV_FIDO2_1: "1"
      ZEROFIDO_PACKED_ATTESTATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync tools
        run: uv sync --locked

      - name: Check release build defaults
        run: uv run python -m unittest tests.app.test_application_manifest tests.app.test_identity

      - name: Native protocol and storage regressions
        run: uv run python tools/run_protocol_regressions.py

      - name: Install pinned Flipper SDK
        env:
          SDK_URL: https://update.flipperzero.one/builds/firmware/1.5.1/flipper-z-f7-sdk-1.5.1.zip
          SDK_SHA256: dfde39df32ba8a9789b26afc1d702579ad8399a1c285770637cfe3287b2e2ffe
        run: |
          set -euo pipefail
          sdk_archive="${RUNNER_TEMP}/flipper-z-f7-sdk-1.5.1.zip"
          curl --fail --location --retry 3 "${SDK_URL}" --output "${sdk_archive}"
          printf '%s  %s\n' "${SDK_SHA256}" "${sdk_archive}" | sha256sum --check --strict
          uv run python -m ufbt update --hw-target=f7 --local "${sdk_archive}"

      - name: Build profile
        run: uv run python -m ufbt

      - name: Package release FAP
        run: >
          uv run python host_tools/package_release.py
          --skip-build
          --allow-prebuilt-input
          --fap dist/zerofido.fap
          --output-fap dist/zerofido-${{ matrix.profile }}-release.fap

      - name: Write checksums
        run: sha256sum dist/zerofido-${{ matrix.profile }}-release.fap > dist/SHA256SUMS

      - name: Upload FAP artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerofido-${{ matrix.profile }}-release
          if-no-files-found: error
          path: |
            dist/zerofido-${{ matrix.profile }}-release.fap
            dist/SHA256SUMS
